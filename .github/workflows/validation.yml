name: Validation

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned site dependencies
        run: python -m pip install -r scripts/build-site-requirements.txt
      - name: Check manifest and generator regression coverage
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check standalone exercise exports
        run: python -B scripts/export-exercise-tests.py
      - name: Check link validator regression coverage
        run: python -B -m unittest discover -s .github/workflows/ci -p 'test_*.py' -v
      - name: Check current deterministic site and every link
        run: python -B .github/workflows/ci/verify_site.py

  exercises:
    name: Exercise verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check exercise runner regression coverage
        run: python -B scripts/verify-exercises-test.py
      - name: Verify reference solutions and expected starter defects
        run: python -B scripts/verify-exercises.py
