<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title | CIC Interview Practice</title>
  <link rel="icon" type="image/png" href="../assets/cic-logo.png">
  <link rel="stylesheet" href="../assets/site.css">
${mermaid_script}</head>
<body>
  <a class="skip-link" href="#main-content">Skip to problem</a>
  <header class="site-header">
    <a class="site-brand" href="../index.html"><img src="../assets/cic-logo.png" width="48" height="48" alt="CIC"><span>Interview Practice</span></a>
    <nav class="site-nav" aria-label="Main navigation"><a href="../index.html">All problems</a></nav>
  </header>
  <main class="container problem-page" id="main-content" tabindex="-1">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol><li><a href="../index.html">All problems</a></li><li><a href="../index.html#$category_id">$category</a></li><li aria-current="page">$page_kind $number</li></ol>
    </nav>
    <div class="page-layout content-layout">
      <aside class="problem-sidebar" aria-label="Problem navigation and resources">
        <p class="eyebrow">$sidebar_label</p>
        <p><span class="tag $badge_class">$badge_label</span></p>
        <nav class="table-of-contents" aria-label="On this page">
          <h2>On this page</h2>

        </nav>
        <div class="sidebar-resources">
          <h2>Resources</h2>
          $starter_link
          <a href="$source_url" target="_blank" rel="noopener noreferrer">Markdown source <span aria-hidden="true">↗</span></a>
        </div>
      </aside>
      <article class="prose" data-problem-id="$problem_id">
$body
      </article>
    </div>
  </main>

</html>
